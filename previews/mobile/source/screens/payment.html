<!-- ============ PAYMENT ============ -->
<sc-if value="{{is.pay}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 393px; height: 852px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; {{fx}}">
  <div style="position: sticky; top: 0; z-index: 20; height: 64px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: rgba(255,253,249,0.8); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); border-bottom: 1px solid rgba(255,255,255,0.75);">
    <button type="button" sc-camel-on-click="{{back}}" aria-label="Back" style="{{backBtn}}"><svg sc-camel-view-box="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; font-size: 18px; line-height: 22px; font-weight: 600;">Payment</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 12px 16px 132px 16px;">
    <div style="position: relative; overflow: hidden; border-radius: 26px; padding: 20px; color: #FFF1D6; background: radial-gradient(120% 90% at 30% 0%, #7A2208 0%, #3E0E04 60%, #260802 100%); border: 1px solid rgba(255,200,90,0.45); box-shadow: inset 0 1px 0 rgba(255,220,140,0.35), 0 18px 34px -16px rgba(90,20,0,0.45); display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #F5D6B0;">Dakshina for {{cb.short}}</span>
      <span style="font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; {{goldText}} font-size: 40px; line-height: 50px; font-weight: 600; font-variant-numeric: tabular-nums;">{{totalTxt}}</span>
      <span style="font-size: 12px; line-height: 17px; color: #F5D6B0;">{{countTxt}} · {{cb.dateLine}}</span>
      <span style="margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: #BBF7D0;"><svg sc-camel-view-box="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>One-time payment · secured by Razorpay</span>
    </div>
    <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; letter-spacing: 0.04em; color: rgba(58,43,26,0.55); padding: 0 4px;">Pay with UPI</span>
    <div style="{{glassCard}} border-radius: 22px; padding: 6px;">
      <sc-for list="{{upiList}}" as="p" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{p.sel}}" sc-camel-on-click="{{p.pick}}" style="{{p.row}}">
          <span style="{{p.badge}}">{{p.i}}</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; text-align: left;"><span style="font-size: 15px; line-height: 20px; font-weight: 600;">{{p.l}}</span><span style="font-size: 12px; line-height: 16px; color: #7A5530;">{{p.s}}</span></span>
          <span style="{{p.radio}}"></span>
        </button>
      </sc-for>
    </div>
    <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; letter-spacing: 0.04em; color: rgba(58,43,26,0.55); padding: 0 4px;">Other ways to pay</span>
    <div style="{{glassCard}} border-radius: 22px; padding: 6px;">
      <sc-for list="{{otherPay}}" as="p" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{p.sel}}" sc-camel-on-click="{{p.pick}}" style="{{p.row}}">
          <span style="{{p.badge}}">{{p.i}}</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; text-align: left;"><span style="font-size: 15px; line-height: 20px; font-weight: 600;">{{p.l}}</span><span style="font-size: 12px; line-height: 16px; color: #7A5530;">{{p.s}}</span></span>
          <span style="{{p.radio}}"></span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 16px 22px 16px; background: rgba(255,253,249,0.86); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-top: 1px solid rgba(255,255,255,0.95);">
  <button type="button" sc-camel-on-click="{{payNow}}" style="{{payBtn}}">{{payLabel}}</button>
</div>
<sc-if value="{{paying}}" hint-placeholder-val="{{false}}">
  <div style="position: absolute; left: 0; top: 0; width: 393px; height: 852px; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(58,43,26,0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);">
    <div role="status" style="width: 300px; padding: 28px 22px; border-radius: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; background: radial-gradient(120% 70% at 50% 0%, #FFF1CF 0%, #FFFDF9 58%); border: 1px solid #FFFFFF; box-shadow: 0 30px 60px -20px rgba(90,30,0,0.36);">
      <svg sc-camel-view-box="0 0 80 80" width="80" height="80" aria-hidden="true"><circle cx="40" cy="40" r="32" fill="none" stroke="rgba(226,140,40,0.2)" stroke-width="7"></circle><circle cx="40" cy="40" r="32" fill="none" stroke="url(#dSaffron)" stroke-width="7" stroke-linecap="round" stroke-dasharray="60 141"><animateTransform sc-camel-attribute-name="transform" type="rotate" from="0 40 40" to="360 40 40" dur="1s" sc-camel-repeat-count="indefinite"></animateTransform></circle><path d="M40 50 C34 45 35 36 40 29 C45 36 46 45 40 50 Z" fill="url(#dFlame)"></path></svg>
      <span style="font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; font-size: 17px; line-height: 21px; font-weight: 600;">Confirming your dakshina…</span>
      <span style="font-size: 13px; line-height: 19px; color: #6B4A2E;">Approve the request in {{payName}}. Please don't close the app.</span>
    </div>
  </div>
</sc-if>
</sc-if>
