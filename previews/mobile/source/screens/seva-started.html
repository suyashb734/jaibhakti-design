<!-- ============ SEVA STARTED ============ -->
<sc-if value="{{is.sevaSuccess}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 393px; height: 852px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; {{fx}}">
  <div style="position: relative; box-sizing: border-box; min-height: 852px; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 16px 40px 16px;">
    <div style="position: absolute; left: 0; top: 0; width: 393px; height: 420px; pointer-events: none; background: radial-gradient(100% 70% at 50% 8%, #FFEEC0 0%, rgba(255,214,102,0.45) 40%, rgba(255,253,249,0) 80%);"></div>
    <svg sc-camel-view-box="0 0 393 420" width="393" height="420" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none;">
      <ellipse cx="40" cy="-20" rx="6" ry="9" fill="url(#dMari)"><animateTransform sc-camel-attribute-name="transform" type="translate" values="0 0; 14 220; -6 440" dur="6s" begin="-1s" sc-camel-repeat-count="indefinite"></animateTransform></ellipse>
      <ellipse cx="110" cy="-20" rx="5" ry="8" fill="url(#dMari2)"><animateTransform sc-camel-attribute-name="transform" type="translate" values="0 0; -12 220; 8 440" dur="7.5s" begin="-3s" sc-camel-repeat-count="indefinite"></animateTransform></ellipse>
      <ellipse cx="190" cy="-20" rx="6" ry="9" fill="url(#dMari)"><animateTransform sc-camel-attribute-name="transform" type="translate" values="0 0; 10 220; -10 440" dur="6.8s" begin="-5s" sc-camel-repeat-count="indefinite"></animateTransform></ellipse>
      <ellipse cx="262" cy="-20" rx="6" ry="9" fill="url(#dMari2)"><animateTransform sc-camel-attribute-name="transform" type="translate" values="0 0; 12 220; -8 440" dur="6.4s" begin="-4s" sc-camel-repeat-count="indefinite"></animateTransform></ellipse>
      <ellipse cx="340" cy="-20" rx="5" ry="8" fill="url(#dMari)"><animateTransform sc-camel-attribute-name="transform" type="translate" values="0 0; -10 220; 10 440" dur="7.2s" begin="-6s" sc-camel-repeat-count="indefinite"></animateTransform></ellipse>
    </svg>
    <div style="position: relative; display: flex; justify-content: center; padding: 12px 0;">
      <span style="position: relative; width: 136px; height: 136px; display: flex; align-items: center; justify-content: center;">
        <span style="position: absolute; left: -28px; top: -28px; right: -28px; bottom: -28px; border-radius: 50%; background: radial-gradient(circle, rgba(34,197,94,0.32) 0%, rgba(34,197,94,0.1) 55%, rgba(34,197,94,0) 72%);"></span>
        <span style="position: relative; width: 136px; height: 136px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #34D27A 0%, #15803D 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 0 0 8px rgba(255,255,255,0.9), 0 22px 40px -14px rgba(21,128,61,0.6);">
          <svg sc-camel-view-box="0 0 24 24" width="72" height="72" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </span>
      </span>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 0 8px;">
      <h1 style="font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; margin: 0; font-size: 28px; line-height: 34px; font-weight: 600;">Your seva has started</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #6B4A2E;">{{ss.title}}</p>
    </div>
    <div style="position: relative; {{glassCard}} border-radius: 24px; padding: 6px 16px; display: flex; flex-direction: column;">
      <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0;"><span style="width: 32px; height: 32px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(37,211,102,0.14);"><svg sc-camel-view-box="0 0 24 24" width="18" height="18" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; line-height: 19px; font-weight: 600;">Receipt on WhatsApp</span><span style="font-size: 13px; line-height: 18px; color: #6B4A2E;">Your payment receipt will be shared with you on WhatsApp.</span></span></div>
      <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid rgba(58,43,26,0.08);"><span style="width: 32px; height: 32px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(245,158,11,0.16);"><svg sc-camel-view-box="0 0 24 24" width="18" height="18" fill="none" stroke="#B5470C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H4z M8 20l4-4 4 4 M8 9h8 M8 12h5"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; line-height: 19px; font-weight: 600;">Seva certificate</span><span style="font-size: 13px; line-height: 18px; color: #6B4A2E;">Will be shared on {{firstPujaLong}}, the day of your seva.</span></span></div>
      <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid rgba(58,43,26,0.08);"><span style="width: 32px; height: 32px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(210,74,14,0.12);"><svg sc-camel-view-box="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#D24A0E"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; line-height: 19px; font-weight: 600;">Seva video</span><span style="font-size: 13px; line-height: 18px; color: #6B4A2E;">Will be shared on WhatsApp within 48 hours of the seva.</span></span></div>
    </div>
    <button type="button" sc-camel-on-click="{{goHomeReset}}" style="position: relative; {{goldBtnFull}}">Home Page</button>
  </div>
</div>
</sc-if>
