<!-- ============ TOAST ============ -->
<sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
  <div role="status" style="{{toastStyle}}">
    <svg sc-camel-view-box="0 0 24 24" width="18" height="18" fill="none" stroke="#FFD24D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M5 12l4 4 10-10"></path></svg>
    <span>{{toastMsg}}</span>
  </div>
</sc-if>

</div>
