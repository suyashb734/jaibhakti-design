name: Design exploration
description: Document alternatives without approving development
title: "[EXP-xxxx] "
labels: [exploration]
body:
  - type: textarea
    id: question
    attributes:
      label: Question hypothesis and alternatives
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Human owner baseline screens and permitted files
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Comparison criteria evidence and limitations
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome rationale and linked change if selected
      description: Selected means chosen for integration, not approved for engineering.
