name: Validate design hub
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    name: Registry and reference integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate references registries and links
        run: python3 tools/validate_design_hub.py
      - name: Check walkthrough catalogue
        run: |
          python3 tools/build_review_catalog.py --check
          python3 tools/build_live_catalogue.py --check
      - name: Check static preview export and its links
        run: python3 tools/build_preview_site.py --out artifacts/ci-preview
      - name: Check exploration and handoff boundaries
        run: python3 -m unittest discover -s tests -v
