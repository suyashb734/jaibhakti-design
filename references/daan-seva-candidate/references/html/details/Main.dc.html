<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dan Seva · Your details</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A6A4B}
</style>
</helmet>
<div style="position: relative; width: 393px; height: 852px; overflow: hidden; box-sizing: border-box; font-family: 'Poppins', sans-serif; color: #3A2B1A; background: linear-gradient(180deg, #FFF6DC 0%, #FFE7A8 100%);">

  <div style="height: 64px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; padding: 0; display: flex; align-items: center; justify-content: center; color: #40260E; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 14px rgba(255,138,61,0.1);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="font-size: 18px; line-height: 22px; font-weight: 600;">Start your seva</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 0 16px;">

    <div style="border-radius: 22px; padding: 12px; display: flex; gap: 12px; align-items: center; background: linear-gradient(160deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.6) 100%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 10px 26px rgba(255,138,61,0.14);">
      <span style="position: relative; flex-shrink: 0; width: 72px; height: 72px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 16px -8px rgba(90,20,0,0.42);">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%;">
          <defs>
            <radialGradient id="halo" cx="50%" cy="44%" r="50%"><stop offset="0" stop-color="#FFE7A3" stop-opacity="0.9"></stop><stop offset="1" stop-color="#FFE7A3" stop-opacity="0"></stop></radialGradient>
            <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD24A"></stop><stop offset="1" stop-color="#F2A007"></stop></linearGradient>
          </defs>
          <rect width="100" height="100" fill="#B5470C"></rect>
          <circle cx="50" cy="44" r="40" fill="url(#halo)"></circle>
          <path d="M34 90 V62 C34 54 40 46 44 38 C47 30 49 22 50 14 C51 22 53 30 56 38 C60 46 66 54 66 62 V90 Z" fill="url(#gold)"></path>
          <path d="M45 90 V74 C45 70 47 67 50 66 C53 67 55 70 55 74 V90 Z" fill="#7A2A06"></path>
          <path d="M50 14 V6 M50 6 L59 9 L50 12 Z" stroke="#FFE7A3" stroke-width="1" fill="#FF5A1F"></path>
        </svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <span style="font-size: 14px; line-height: 19px; font-weight: 600;">Gajalakshmi Mata Mandir</span>
        <span style="font-size: 12px; line-height: 16px; color: #6B4A2E;">Dan Seva · This Friday</span>
      </span>
    </div>

    <div style="border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; background: #FFF1E6; border: 1px solid rgba(181,71,12,0.25);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A8460F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9.5 2.5h5"></path></svg>
      <span style="flex-grow: 1; display: flex; flex-direction: column;">
        <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #7A2A06;">Only 41 slots left</span>
        <span style="font-size: 11px; line-height: 15px; color: #6B4A2E;">Booking closes in</span>
      </span>
      <span style="font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums; color: #7A2A06;" role="timer" aria-live="off">{{timer}}</span>
    </div>

    <div style="border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(160deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.6) 100%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 10px 26px rgba(255,138,61,0.14);">
      <label for="f-name" style="font-size: 12px; line-height: 16px; font-weight: 500; color: #6B4A2E;">Your name</label>
      <input id="f-name" type="text" placeholder="Enter your name" style="height: 54px; padding: 0 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(58,43,26,0.14); font: inherit; font-size: 16px; color: #3A2B1A; outline: none;">

      <label for="f-gotra" style="font-size: 12px; line-height: 16px; font-weight: 500; color: #6B4A2E;">Gotra</label>
      <input id="f-gotra" type="text" placeholder="e.g. Bharadwaj" style="height: 54px; padding: 0 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(58,43,26,0.14); font: inherit; font-size: 16px; color: #3A2B1A; outline: none;">
      <span style="font-size: 12px; line-height: 17px; color: #6B4A2E;">Your name and gotra will be sent to Gajalakshmi Mata Mandir temple.</span>

      <label for="f-phone" style="font-size: 12px; line-height: 16px; font-weight: 500; color: #6B4A2E;">Phone number</label>
      <div style="display: flex; gap: 8px;">
        <div style="flex-grow: 1; min-width: 0; height: 54px; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(58,43,26,0.14); display: flex; align-items: center; overflow: hidden;">
          <span style="padding: 0 10px 0 14px; font-weight: 500; border-right: 1px solid rgba(58,43,26,0.1); height: 100%; display: flex; align-items: center;">+91</span>
          <input id="f-phone" type="tel" inputmode="numeric" placeholder="98765 43210" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 12px; font: inherit; font-size: 16px; color: #3A2B1A; outline: none;">
        </div>
        <button type="button" style="height: 54px; padding: 0 16px; border-radius: 16px; font: inherit; font-size: 14px; font-weight: 600; color: #41240A; background: linear-gradient(100deg, #FFD24A 0%, #FF8A3D 100%); border: 0; box-shadow: 0 6px 14px rgba(255,107,26,0.24); flex-shrink: 0;">Verify</button>
      </div>

      <span style="font-size: 14px; line-height: 19px; font-weight: 600; margin-top: 6px;">Verification</span>
      <span style="font-size: 12px; line-height: 17px; color: #6B4A2E;">Enter the 4-digit code sent to your phone</span>
      <div style="display: flex; gap: 12px; justify-content: space-between;">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 1" style="width: 64px; height: 64px; box-sizing: border-box; text-align: center; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(58,43,26,0.14); font: inherit; font-size: 24px; font-weight: 600; color: #3A2B1A; outline: none;">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 2" style="width: 64px; height: 64px; box-sizing: border-box; text-align: center; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(58,43,26,0.14); font: inherit; font-size: 24px; font-weight: 600; color: #3A2B1A; outline: none;">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 3" style="width: 64px; height: 64px; box-sizing: border-box; text-align: center; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(58,43,26,0.14); font: inherit; font-size: 24px; font-weight: 600; color: #3A2B1A; outline: none;">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 4" style="width: 64px; height: 64px; box-sizing: border-box; text-align: center; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(58,43,26,0.14); font: inherit; font-size: 24px; font-weight: 600; color: #3A2B1A; outline: none;">
      </div>
      <button type="button" style="align-self: flex-start; border: 0; background: none; padding: 6px 0; font: inherit; font-size: 13px; line-height: 18px; font-weight: 500; color: #A8460F;">Resend code</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 22px 16px; box-sizing: border-box; background: rgba(255,253,249,0.86); border-top: 1px solid rgba(255,255,255,0.95); box-shadow: 0 -12px 30px -16px rgba(150,60,0,0.3);">
    <button type="button" style="width: 100%; height: 56px; border-radius: 999px; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; color: #41240A; background: linear-gradient(100deg, #FFD24A 0%, #FF8A3D 100%); border: 0; box-shadow: 0 12px 26px rgba(255,107,26,0.32);">Start Seva<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { secs: 9 * 60 + 42 };
}
componentDidMount() {
this._t = setInterval(() => {
this.setState((s) => ({ secs: s.secs > 0 ? s.secs - 1 : 9 * 60 + 42 }));
}, 1000);
}
componentWillUnmount() {
clearInterval(this._t);
}
renderVals() {
const s = this.state.secs;
const pad = (n) => (n < 10 ? '0' + n : '' + n);
return { timer: pad(Math.floor(s / 60)) + ':' + pad(s % 60) };
}
}
</script>
</body>
</html>
