<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dan Seva · Booked</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes popIn{0%{transform:scale(0.3);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(30,138,74,0.35)}100%{box-shadow:0 0 0 22px rgba(30,138,74,0)}}
@keyframes drawTick{to{stroke-dashoffset:0}}
.tick-badge{animation:popIn 0.55s cubic-bezier(0.2,0.8,0.2,1) both, ring 1.4s ease-out 0.5s 2}
.tick-path{stroke-dasharray:1;stroke-dashoffset:1;animation:drawTick 0.5s ease-out 0.45s forwards}

/* ---- delivery scene: one 7s loop ---- */
@keyframes envX{0%,34%{transform:translateX(0)}70%,100%{transform:translateX(223px)}}
@keyframes envY{
0%{transform:translateY(0) rotate(0) scale(1);opacity:0}
5%{opacity:1}
34%{transform:translateY(0) rotate(-3deg) scale(1)}
38.5%{transform:translateY(-16px) rotate(-7deg) scale(1)}
43%{transform:translateY(-25px) rotate(-6deg) scale(1)}
47.5%{transform:translateY(-28px) rotate(-2deg) scale(1)}
52%{transform:translateY(-24px) rotate(2deg) scale(1)}
56.5%{transform:translateY(-13px) rotate(5deg) scale(1)}
61%{transform:translateY(5px) rotate(8deg) scale(0.95)}
65.5%{transform:translateY(29px) rotate(8deg) scale(0.8)}
70%{transform:translateY(60px) rotate(4deg) scale(0.5);opacity:1}
75%{transform:translateY(68px) rotate(0) scale(0.2);opacity:0}
100%{transform:translateY(68px) rotate(0) scale(0.2);opacity:0}}
@keyframes cardSlide{
0%{transform:translateY(-32px);opacity:0}
7%{transform:translateY(-32px);opacity:1}
10%{transform:translateY(-32px)}
24%,100%{transform:translateY(8px);opacity:1}}
@keyframes flap{0%,24%{transform:scaleY(-1)}32%,100%{transform:scaleY(1)}}
@keyframes seal{0%,31%{transform:translate(-50%,-50%) scale(0)}35%{transform:translate(-50%,-50%) scale(1.3)}38%,100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes phoneSend{0%,28%{transform:translateY(0) scale(1)}33%{transform:translateY(-4px) scale(1.04)}40%,100%{transform:translateY(0) scale(1)}}
@keyframes templeBump{0%,70%{transform:scale(1)}76%{transform:scale(1.06)}86%,100%{transform:scale(1)}}
@keyframes halo{0%,68%{transform:translate(-50%,-50%) scale(0.5);opacity:0}74%{opacity:0.95}92%,100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
@keyframes halo2{0%,72%{transform:translate(-50%,-50%) scale(0.5);opacity:0}78%{opacity:0.8}96%,100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
@keyframes pill{0%,78%{opacity:0;transform:translateY(8px) scale(0.92)}84%{opacity:1;transform:translateY(0) scale(1)}96%{opacity:1;transform:translateY(0) scale(1)}99%,100%{opacity:0;transform:translateY(-4px) scale(1)}}
@keyframes dash{to{stroke-dashoffset:-24}}
.env-x{animation:envX 7s linear infinite}
.env-y{animation:envY 7s linear infinite}
.env-card{animation:cardSlide 7s cubic-bezier(0.3,0.7,0.3,1) infinite}
.env-flap{transform-origin:50% 0;animation:flap 7s ease-in-out infinite}
.env-seal{animation:seal 7s ease-out infinite}
.phone-img{transform-origin:50% 100%;animation:phoneSend 7s ease-in-out infinite}
.temple-img{transform-origin:50% 100%;animation:templeBump 7s ease-in-out infinite}
.halo-a{animation:halo 7s ease-out infinite}
.halo-b{animation:halo2 7s ease-out infinite}
.pill{animation:pill 7s ease-out infinite}
.path-dash{animation:dash 1.2s linear infinite}
@media (prefers-reduced-motion: reduce){
.tick-badge,.tick-path,.env-x,.env-y,.env-card,.env-flap,.env-seal,.phone-img,.temple-img,.halo-a,.halo-b,.pill,.path-dash{animation:none}
.tick-path{stroke-dashoffset:0}
.env-x{transform:translateX(111px)}
.env-y{opacity:1}
.env-card{transform:translateY(8px);opacity:1}
.env-flap{transform:scaleY(1)}
.env-seal{transform:translate(-50%,-50%) scale(1)}
.pill{opacity:1}
.halo-a,.halo-b{opacity:0}
}
</style>
</helmet>
<div style="position: relative; width: 393px; height: 852px; overflow: hidden; box-sizing: border-box; font-family: 'Poppins', sans-serif; color: #3A2B1A; background: linear-gradient(180deg, #FFF6DC 0%, #FFE7A8 100%);">

  <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 80px 28px 0 28px; gap: 16px;">
    <span class="tick-badge" style="width: 96px; height: 96px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #1E8A4A; box-shadow: 0 0 0 10px rgba(30,138,74,0.14), 0 16px 30px -10px rgba(20,90,50,0.5);">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Booked"><path class="tick-path" pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </span>
    <h1 style="margin: 12px 0 0 0; font-size: 24px; line-height: 32px; font-weight: 600; text-wrap: balance;">We've booked your Dan Seva for this Friday</h1>
    <span style="font-size: 18px; line-height: 27px; font-weight: 600; color: #3A2B1A; text-wrap: balance;">Your name and gotra have been sent to Gajalakshmi Mata Mandir temple.</span>

    <!-- delivery scene -->
    <div aria-hidden="true" style="position: relative; width: 337px; height: 214px; margin-top: 4px;">

      <!-- flight path -->
      <svg width="337" height="214" viewBox="0 0 337 214" style="position: absolute; left: 0; top: 0;">
        <path class="path-dash" d="M58 76 Q170 -2 281 136" fill="none" stroke="#B5470C" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 10"></path>
      </svg>

      <!-- phone, left -->
      <img class="phone-img" src="./assets/014f935ead744a740026610fecf68ff1.png" alt="" style="position: absolute; left: 0; bottom: 0; width: 104px; height: auto; display: block;">

      <!-- temple, right -->
      <span style="position: absolute; right: 0; bottom: 0; width: 112px; height: 134px;">
        <span class="halo-a" style="position: absolute; left: 50%; top: 45%; width: 130px; height: 130px; border-radius: 999px; transform: translate(-50%,-50%) scale(0.5); opacity: 0; background: radial-gradient(circle, rgba(255,210,74,0.9) 0%, rgba(255,210,74,0) 70%);"></span>
        <span class="halo-b" style="position: absolute; left: 50%; top: 45%; width: 110px; height: 110px; border-radius: 999px; transform: translate(-50%,-50%) scale(0.5); opacity: 0; border: 2px solid rgba(232,171,0,0.8);"></span>
        <img class="temple-img" src="./assets/9f68e45bed6478b8d9c4044d13617f82.png" alt="" style="position: absolute; left: 0; bottom: 0; width: 112px; height: auto; display: block;">
      </span>

      <!-- envelope -->
      <span class="env-x" style="position: absolute; left: 0; top: 40px; width: 116px; height: 72px;">
        <span class="env-y" style="position: absolute; left: 0; top: 0; width: 116px; height: 72px; opacity: 0; filter: drop-shadow(0 8px 10px rgba(122,42,6,0.28));">
          <!-- back -->
          <span style="position: absolute; left: 0; top: 0; width: 116px; height: 72px; border-radius: 10px; background: #F6D98C; border: 1.5px solid #E8AB00; box-sizing: border-box;"></span>
          <!-- card (name + gotra) -->
          <span class="env-card" style="position: absolute; left: 5px; top: 0; width: 106px; height: 46px; border-radius: 6px; background: #FFFFFF; border: 1px solid rgba(232,171,0,0.7); box-sizing: border-box; padding: 4px 8px; display: flex; flex-direction: column; justify-content: center; gap: 1px; transform: translateY(-32px); opacity: 0;">
            <span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #3A2B1A; white-space: nowrap;">Aarav Sharma</span>
            <span style="font-size: 11px; line-height: 14px; font-weight: 500; color: #A8460F; white-space: nowrap;">Gotra · Kashyap</span>
          </span>
          <!-- front pocket -->
          <span style="position: absolute; left: 0; top: 0; width: 116px; height: 72px; border-radius: 10px; background: linear-gradient(180deg, #FFF3C4 0%, #FFE08A 100%); clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%);"></span>
          <span style="position: absolute; left: 0; top: 0; width: 116px; height: 72px; border-radius: 10px; border: 1.5px solid #E8AB00; box-sizing: border-box; clip-path: polygon(0 28%, 50% 62%, 100% 28%, 100% 100%, 0 100%);"></span>
          <!-- flap -->
          <span class="env-flap" style="position: absolute; left: 0; top: 0; width: 116px; height: 45px; transform: scaleY(-1); background: linear-gradient(180deg, #FFE9A8 0%, #FFD24A 100%); clip-path: polygon(0 0, 100% 0, 50% 100%, 0 0); border-radius: 10px 10px 0 0;"></span>
          <!-- wax seal -->
          <span class="env-seal" style="position: absolute; left: 50%; top: 42px; width: 24px; height: 24px; border-radius: 999px; background: radial-gradient(circle at 35% 30%, #F2642A, #A8300A); box-shadow: 0 2px 4px rgba(90,20,0,0.4); transform: translate(-50%,-50%) scale(0); display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFE7A3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"></path></svg>
          </span>
        </span>
      </span>

      <!-- delivered pill -->
      <span class="pill" style="position: absolute; left: 50%; top: 22px; margin-left: -78px; height: 32px; padding: 0 14px 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #FFFFFF; background: #17713C; box-shadow: 0 8px 16px -6px rgba(20,90,50,0.5); opacity: 0; white-space: nowrap;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Delivered to temple
      </span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 22px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; background: rgba(255,253,249,0.9); border-radius: 28px 28px 0 0; border-top: 1px solid rgba(255,255,255,0.95); box-shadow: 0 -12px 30px -16px rgba(150,60,0,0.3);">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 17px; line-height: 22px; font-weight: 600;">Complete your payment</span>
      <span style="font-size: 12px; line-height: 17px; color: #6B4A2E;">Pay to confirm your Dan Seva</span>
    </div>
    <button type="button" style="width: 100%; height: 56px; border-radius: 999px; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; color: #41240A; background: linear-gradient(100deg, #FFD24A 0%, #FF8A3D 100%); border: 0; box-shadow: 0 12px 26px rgba(255,107,26,0.32);">Pay ₹51</button>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; line-height: 17px; color: #6B4A2E;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B4A2E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"></path><path d="M18 3v4h-4M6 21v-4h4"></path></svg>
      <span><strong style="font-weight: 600; color: #3A2B1A;">₹101 autopay</strong> from next week · Cancel anytime</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>

return {};
}
}
</script>
</body>
</html>
